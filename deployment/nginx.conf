server {
    listen 443 ssl;
    server_name api.crm.learnielts.org;

    root /var/www/smartcrm-api/public;
    index index.php;

    # SSL — update paths to your actual certificate
    ssl_certificate     /etc/letsencrypt/live/api.crm.learnielts.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.crm.learnielts.org/privkey.pem;

    # Laravel API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Reverb WebSocket — proxy /app and /apps to Reverb on port 8080
    location /app {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     60;
    }

    location /apps {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     60;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.crm.learnielts.org;
    return 301 https://$host$request_uri;
}
