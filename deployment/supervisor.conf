[program:smartcrm-worker]
command=php /var/www/smartcrm-api/artisan queue:work --tries=3 --backoff=10 --max-time=3600
directory=/var/www/smartcrm-api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/var/www/smartcrm-api/storage/logs/worker.log

[program:smartcrm-reverb]
command=php /var/www/smartcrm-api/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/smartcrm-api
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/smartcrm-api/storage/logs/reverb.log
